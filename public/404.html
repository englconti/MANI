<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · MANI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: #fde5d9;
      color: #1b1411;
      font-family: Gabarito, "Trebuchet MS", system-ui, sans-serif;
    }
    main {
      width: 100%;
      max-width: 440px;
      padding: 28px 24px 24px;
      text-align: center;
      background: #fff;
      border: 2.5px solid #1b1411;
      border-radius: 24px;
      box-shadow: 4px 4px 0 #1b1411;
    }
    img { width: 140px; height: auto; }
    p.code { margin: 8px 0 0; font-size: 0.95rem; font-weight: 700; color: #5a4d47; }
    h1 { margin: 4px 0 8px; font-size: 1.8rem; line-height: 1.15; }
    p.text { margin: 0 0 22px; font-size: 1.05rem; line-height: 1.5; color: #1b1411; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 10px 26px;
      background: #f26b54;
      color: #1b1411;
      border: 2.5px solid #1b1411;
      border-radius: 14px;
      box-shadow: 3px 3px 0 #1b1411;
      font-size: 1.1rem;
      font-weight: 800;
      text-decoration: none;
    }
    a:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #1b1411; }
    a:focus-visible { outline: 3px solid #0e6b78; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/mani-erro.png" alt="Mani, o porquinho mascote">
    <p class="code">Erro 404</p>
    <h1>Página não encontrada</h1>
    <p class="text">O endereço pode estar errado ou a página foi removida. Volte ao início para continuar aprendendo.</p>
    <a href="/">Voltar ao início</a>
  </main>
</body>
</html>
